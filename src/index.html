<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Feeder</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        h1 {
            color: #333;
            margin-bottom: 40px;
            font-size: 2rem;
        }
        .feed-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 50%;
            width: 220px;
            height: 220px;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(76, 175, 80, 0.4);
            transition: transform 0.1s, box-shadow 0.1s, background-color 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .feed-btn:active {
            transform: scale(0.95);
            box-shadow: 0 4px 10px rgba(76, 175, 80, 0.4);
            background-color: #45a049;
        }
        #status {
            margin-top: 30px;
            font-size: 20px;
            font-weight: bold;
            color: #666;
            height: 24px;
        }
    </style>
</head>
<body>

    <h1>🐾 Cat Feeder</h1>

    <button class="feed-btn" onclick="dispenseFood()">FEED NOW</button>

    <div id="status"></div>

    <script>
        function dispenseFood() {
            const statusEl = document.getElementById('status');
            statusEl.textContent = 'Dispensing...';
            statusEl.style.color = '#666';

            // Send the request to your Pico's web server
            fetch('/feed')
                .then(response => {
                    if (response.ok) {
                        statusEl.textContent = '✅ Cat Fed Successfully!';
                        statusEl.style.color = '#4CAF50';
                        
                        // Clear the success message after 3 seconds
                        setTimeout(() => {
                            statusEl.textContent = '';
                        }, 3000);
                    } else {
                        statusEl.textContent = '❌ Error triggering feeder.';
                        statusEl.style.color = '#f44336';
                    }
                })
                .catch(error => {
                    statusEl.textContent = '❌ Network Error.';
                    statusEl.style.color = '#f44336';
                });
        }
    </script>
</body>
</html>
